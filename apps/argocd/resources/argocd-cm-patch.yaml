apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  kustomize.buildOptions: "--enable-alpha-plugins --enable-helm --enable-exec"
  url: "https://argocd.internal.manickamx2.com"
  server.insecure: "true"
  oidc.config: |
    name: authentik
    issuer: https://authentik.manickamx2.com/application/o/argocd/
    clientID: argocd
    clientSecret: $argocd-oidc-secret:oidc.authentik.clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
