apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2024.4.2
    releaseName: authentik
    namespace: authentik
    valuesFile: values.yaml

resources:
  - ./resources/httproute.yaml

generators:
  - ./ksops-generator.yaml
