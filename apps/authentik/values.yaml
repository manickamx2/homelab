# Authentik Helm Chart Values
# https://github.com/goauthentik/helm/blob/main/charts/authentik/values.yaml

global:
  image:
    # Temporarily pinned to 2025.10.3 to bypass a fresh-install bug in 2025.12+
    # Bug: "relation authentik_core_group does not exist" in to_2025_12_group_duplicate.py
    # Ref: https://github.com/goauthentik/authentik/issues/20667
    tag: "2025.10.3"
  envFrom:
    - secretRef:
        name: "authentik-secret"
  env:
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-postgresql
          key: password

authentik:
  # This sends anonymous usage-data, stack traces on errors and
  # performance data to sentry.io, and is fully opt-in
  error_reporting:
    enabled: true

server:
  route:
    main:
      enabled: true
      hostnames:
        - authentik.manickamx2.com
      parentRefs:
        - name: public-gateway
          namespace: infrastructure

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-postgresql
    username: authentik
    database: authentik
